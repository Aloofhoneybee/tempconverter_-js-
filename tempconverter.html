
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outerdiv">
        <div class="innerdiv">
            <img src="images.jpg" alt="weather">

            <form action="tempconverter.html" method="post" id="tempman" onsubmit="event.preventDefault()">
                <label for="temp" style="font-weight: bold;">Current Temperature</label>
                <div class="input-row">
                    <span id="current-temp-symbol" class="unit-symbol">°C</span>
                    <input type="number" id="temp">
                </div>

                <label for="convert">Convert to</label>
                <select id="convert" name="convert">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

                <br>
                <p>Current in what unit?</p>
                <input type="radio" name="temperature" value="kelvin">
                <label for="kelvin">Kelvin</label>
                <br>

                <input type="radio" name="temperature" value="celsius" checked>
                <label for="celsius">Celsius</label>
                <br>

                <input type="radio" name="temperature" value="fahrenheit">
                <label for="fahrenheit">Fahrenheit</label>
                <br>

                <input style="margin-top: 15px;" type="submit" onclick="converter()">

                <p>Result</p>
                <input type="text" id="result">
            </form>
        </div>
    </div>

    <script>
        const tempInput = document.getElementById("temp");
        const currentTempSymbol = document.getElementById("current-temp-symbol");
        const unitRadios = document.querySelectorAll('input[name="temperature"]');

        function updateCurrentSymbol() {
            const selectedUnit = document.querySelector('input[name="temperature"]:checked')?.value || "celsius";
            const symbols = {
                celsius: "°C",
                fahrenheit: "°F",
                kelvin: "K"
            };
            currentTempSymbol.textContent = symbols[selectedUnit] || "°C";
        }

        unitRadios.forEach((radio) => {
            radio.addEventListener("change", updateCurrentSymbol);
        });

        updateCurrentSymbol();

        function converter() {
            const temp = Number(tempInput.value);
            const convert = document.getElementById("convert").value.toLowerCase();
            const currentTemp = document.querySelector('input[name="temperature"]:checked')?.value;

            if (Number.isNaN(temp)) {
                alert("Please enter a valid temperature.");
                return;
            }

            let result;

            switch (convert) {
                case "celsius": {
                    if (currentTemp === "celsius") {
                        result = temp;
                    } else if (currentTemp === "fahrenheit") {
                        result = (temp - 32) / 1.8;
                    } else {
                        result = temp - 273.15;
                    }
                    break;
                }
                case "kelvin": {
                    if (currentTemp === "kelvin") {
                        result = temp;
                    } else if (currentTemp === "fahrenheit") {
                        result = (temp + 459.67) / 1.8;
                    } else {
                        result = temp + 273.15;
                    }
                    break;
                }
                case "fahrenheit": {
                    if (currentTemp === "fahrenheit") {
                        result = temp;
                    } else if (currentTemp === "celsius") {
                        result = temp * 1.8 + 32;
                    } else {
                        result = temp * 1.8 - 459.67;
                    }
                    break;
                }
                default: {
                    alert("Unidentified string input.");
                    return;
                }
            }

            document.getElementById("result").value = result;
        }
    </script>
</body>
</html>
